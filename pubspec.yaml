name: citeintime
description: "Geofenced attendance mobile application powered by Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Backend & Realtime
  supabase_flutter: ^2.8.0

  # Map & Geofencing
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Date Formatting & Near-Time Notifications
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2

  # Icons
  cupertino_icons: ^1.0.8
  ota_update: ^7.1.0
  http: ^1.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/dcslogo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#071E3D" # Grand Line deep ocean navy background
  adaptive_icon_foreground: "assets/images/dcslogo.jpg"
  remove_alpha_ios: true