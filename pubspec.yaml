name: citeintime
description: "Geofenced attendance mobile application powered by Flutter and Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Backend & Realtime
  supabase_flutter: ^2.8.0

  # Map & Geofencing
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1

  # Date Formatting & Near-Time Notifications
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Required for Shorebird automatic OTA updates
 # assets:
  #  - shorebird.yaml