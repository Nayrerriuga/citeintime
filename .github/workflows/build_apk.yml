name: Build & Publish Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate Keystore & Configure Signing
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release-keystore.jks \
            -alias citeintime \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass citeintime2026 \
            -keypass citeintime2026 \
            -dname "CN=CiteInTime, OU=DCS, O=CiteInTime, L=Lianga, S=Surigao del Sur, C=PH"

          cat <<EOF > android/key.properties
          storePassword=citeintime2026
          keyPassword=citeintime2026
          keyAlias=citeintime
          storeFile=release-keystore.jks
          EOF

          # Force release buildType in build.gradle / build.gradle.kts to use debug signing if release signing isn't wired
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle
          fi

      - name: Build Signed Release APK
        run: flutter build apk --release

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (${{ github.run_number }})
          body: "Automated build from commit ${{ github.sha }}"
          files: build/app/outputs/flutter-apk/app-release.apk