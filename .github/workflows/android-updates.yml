name: Android updates

on:
  push:
    branches:
      - main
    paths:
      - lib/**
      - pubspec.yaml
      - pubspec.lock
      - android/**
      - assets/**
      - ios/**

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      dart_only: ${{ steps.changes.outputs.dart_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            files="$(git ls-tree -r --name-only "$AFTER")"
          else
            files="$(git diff --name-only "$BEFORE" "$AFTER")"
          fi

          dart_only=true
          if [[ -z "$files" ]]; then
            dart_only=false
          else
            while IFS= read -r file; do
              [[ "$file" == lib/*.dart ]] || dart_only=false
            done <<< "$files"
          fi

          echo "dart_only=$dart_only" >> "$GITHUB_OUTPUT"

  patch:
    needs: classify
    if: needs.classify.outputs.dart_only == 'true'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: latest
          track: stable

  full-apk:
    needs: classify
    if: needs.classify.outputs.dart_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: citeintime-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
